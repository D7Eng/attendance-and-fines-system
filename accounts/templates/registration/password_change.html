{% extends "base.html" %}
{% block title %}Change password · DuesTrack{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Change password</h1>
  {% if forced %}<p class="msg msg-warning">You are using a temporary password. Choose your own password to continue.</p>{% endif %}
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Change password</button>
  </form>
</section>
{% endblock %}
