<form method="get" class="term-pick noprint">
  {% for k, v in request.GET.items %}{% if k != "term" %}<input type="hidden" name="{{ k }}" value="{{ v }}">{% endif %}{% endfor %}
  <select name="term" onchange="this.form.submit()" aria-label="Term">
    {% for t in terms %}<option value="{{ t.pk }}"{% if t.pk == term.pk %} selected{% endif %}>{{ t.name }}{% if t.is_active %} (active){% endif %}</option>{% endfor %}
  </select>
</form>
