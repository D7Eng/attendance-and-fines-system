# /etc/nginx/sites-available/duestrack — certificates from certbot (Let's Encrypt).
server {
    listen 80;
    server_name duestrack.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name duestrack.example.org;

    ssl_certificate /etc/letsencrypt/live/duestrack.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/duestrack.example.org/privkey.pem;

    client_max_body_size 6m;  # roster and scan uploads are capped at 5 MB
    add_header X-Robots-Tag "noindex, nofollow" always;

    location /static/ {
        alias /srv/duestrack/staticfiles/;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
